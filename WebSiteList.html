<li id="list">
</li>
<script> 
var list = document.getElementById("list");
fetch("list.json")
.then(res => res.json())
.then(data => {
    for(var i = 0; i < data.length; i++){
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = data[i].url;
        a.textContent = data[i].name;
    }
})

</script>
